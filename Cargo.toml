[package]
name = "simple-convert"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico"] }
pdfium-render = { version = "=0.8.35", default-features = false, features = ["pdfium_7350", "image_025", "thread_safe"] }
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

